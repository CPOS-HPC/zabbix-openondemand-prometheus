zabbix_export:
  version: '7.0'
  template_groups:
  - uuid: 4fa3edd3368c44fbb900f50980d5cfb6
    name: Templates/Applications
  templates:
  - uuid: 06b7447dc5df4a5bacdae7aeda5dd78a
    template: Open OnDemand by Prometheus
    name: Open OnDemand by Prometheus
    description: Monitors Open OnDemand via OSC ondemand_exporter using a local Zabbix agent. The agent fetches localhost:9301/metrics with web.page.get,
      so the exporter port does not need to be exposed to the Zabbix server/proxy. Includes active PUNs, Apache client/WebSocket connections,
      PUN resource usage, Passenger dashboard metrics, exporter collector health, graphs, dashboards, and alerts.
    groups:
    - name: Templates/Applications
    items:
    - uuid: 4890f56c30754ac2bb02ac734ce4e157
      name: 'Open OnDemand: Get Prometheus metrics'
      key: web.page.get["{$OOD.METRICS.HOST}","{$OOD.METRICS.PATH}","{$OOD.METRICS.PORT}"]
      delay: 1m
      history: 1h
      trends: '0'
      value_type: TEXT
      description: Fetches the Open OnDemand exporter Prometheus endpoint locally through the Zabbix agent. The HTTP response headers returned
        by web.page.get are stripped before Prometheus preprocessing.
      preprocessing:
      - type: REGEX
        parameters:
        - (?s)^.*?\r?\n\r?\n(.*)$
        - \1
        error_handler: DISCARD_VALUE
      tags:
      - tag: component
        value: raw
      - tag: Application
        value: Open OnDemand
      triggers:
      - uuid: 99a7f4e8e0f34b32a2d819cb6ef6377d
        expression: nodata(/Open OnDemand by Prometheus/web.page.get["{$OOD.METRICS.HOST}","{$OOD.METRICS.PATH}","{$OOD.METRICS.PORT}"],5m)=1
        name: 'Open OnDemand: Metrics endpoint unavailable'
        priority: AVERAGE
        description: No data has been received from the Open OnDemand exporter for 5 minutes.
    - uuid: f11d8f9a31a24cc79e0d6e6df2a9b134
      name: 'Open OnDemand: Active PUNs'
      type: DEPENDENT
      key: ood.active_puns
      history: 30d
      value_type: UNSIGNED
      description: Number of active Per-User NGINX (PUN) instances.
      preprocessing:
      - type: PROMETHEUS_PATTERN
        parameters:
        - ondemand_active_puns
        - value
        error_handler: CUSTOM_VALUE
        error_handler_params: '0'
      master_item:
        key: web.page.get["{$OOD.METRICS.HOST}","{$OOD.METRICS.PATH}","{$OOD.METRICS.PORT}"]
      tags:
      - tag: component
        value: pun
      - tag: Application
        value: Open OnDemand
    - uuid: e9181f1c4d024c15beffc588859dcd9f
      name: 'Open OnDemand: Rack apps'
      type: DEPENDENT
